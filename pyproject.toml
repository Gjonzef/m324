[project]
name = "ledger-ipa-listener"
version = "0.1.0"
description = "Event-driven billing ledger listener (Kafka/Debezium -> ClickHouse)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "clickhouse-connect>=0.7.0",
  "confluent-kafka>=2.5.0",
  "django>=5.2.0",
  "mysql-connector-python>=9.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.uv]
package = false
